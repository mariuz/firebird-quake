name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The shareware pak sits inside an LHA archive in quake106.zip
      - run: sudo apt-get install -y lhasa

      - name: Cache the paks (shareware, LibreQuake)
        id: pak
        uses: actions/cache@v4
        with:
          path: public/pak/
          key: paks-${{ hashFiles('scripts/fetch-pak.mjs') }}

      - name: Fetch the shareware pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: npm run fetch-pak

      # LibreQuake lite (free game data, BSD-3): a whole free game in public/pak/lq1/, and a pak1.pak
      # whose models give the registered monsters a free look beside the shareware pak0.pak
      - name: Fetch LibreQuake
        if: steps.pak.outputs.cache-hit != 'true'
        run: npm run fetch-pak -- --librequake

      # Runs the game's SQL inside the real Firebird WASM engine under Node:
      # loads E1M1, walks, shoots, opens a door, renders frames.
      - name: SQL smoke test
        run: npm test

      # The same game logic over LibreQuake's data: its models carry no frame names, so the id frame
      # layouts (src/framelayouts.js) drive them
      - name: LibreQuake smoke test
        run: PAK=public/pak/lq1/pak0.pak PAK1=public/pak/lq1/pak1.pak node scripts/sql-smoke.mjs start

      # Picks up the rune, Chthon rises, lava, both terminals, three bolts, the exit opens
      - name: The House of Chthon
        run: npm run test:boss

      # The pak1 monsters' AI (enforcer, death knight, vore, spawn, rotfish, Shub-Niggurath), without pak1
      - name: The registered monsters
        run: npm run test:registered

      # Ziggurat Vertigo: low gravity, long jumps, grenades that fly, the exit to E1M5
      - name: Ziggurat Vertigo
        run: npm run test:e1m8

      # The crucified zombies (start map) and Gloom Keep's flooded moat: swimming, breath, drowning
      - name: Crucified zombies and the flooded moat
        run: npm run test:e1m5

      # Castle of the Damned: the drawbridge slab sinks into the moat and the player wades across
      - name: The drawbridge
        run: npm run test:e1m2

      # The Necropolis: the gold key springs the zombie pits; zombies shrug off pellets, go down, get up, throw flesh, die only gibbed
      - name: The zombie pits
        run: npm run test:e1m3

      # The Grisly Grotto: two buttons open the underwater door, swim through, surface by the ledge for the secret, water-jump out, take the exit to E1M8
      - name: The underwater secret
        run: npm run test:e1m4

      # The Door To Chthon: the gold runekey doors refuse, the key wakes its guard, the doors take the key and open, the exit to E1M7
      - name: The gold key
        run: npm run test:e1m6

      # The QuakeC VM in PSQL runs the real progs.dat: pure functions, builtins, entity fields, worldspawn
      - name: The QuakeC VM
        run: npm run test:qcvm

      # QuakeC mode: E1M1 played by the original progs.dat on the engine's physics
      - name: QuakeC on the engine's physics
        run: npm run test:qcplay

      # The page's QuakeC mode: qc_tic's row, the intermission, and a level change carrying the parms
      - name: The page in QuakeC mode
        run: npm run test:qctic

      # progs.dat's monsters on the engine: a grunt sees, shoots and dies; a dog runs at the player
      - name: QuakeC monsters
        run: npm run test:qcai

      - name: QuakeC compiled to PSQL
        run: npm run test:qcjit

      - name: LibreQuake in QuakeC mode
        run: npm run test:qclq

      - name: Headless screenshots
        run: npm run screenshots

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
