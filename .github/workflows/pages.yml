name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The paks, fetched once and cached for the test jobs: the shareware pak0.pak (inside an LHA archive in
  # quake106.zip) and LibreQuake lite (free game data, BSD-3: a whole free game in public/pak/lq1/, and a
  # pak1.pak whose models give the registered monsters a free look beside the shareware pak0.pak)
  paks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the paks (shareware, LibreQuake, the mods)
        id: pak
        uses: actions/cache@v4
        with:
          path: |
            public/pak/
            mods/
          key: paks-${{ hashFiles('scripts/fetch-pak.mjs') }}
      - name: Fetch the paks
        if: steps.pak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y lhasa
          npm run fetch-pak
          npm run fetch-pak -- --librequake
          npm run fetch-pak -- --mods

  # The tests, in groups that run side by side (each about as long as the others); every test runs the
  # game's SQL inside the real Firebird WASM engine under Node
  test:
    needs: paks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # demos played back bit for bit; the skills; infighting
          - group: demos and monsters
            run: |
              npm run test:demo
              npm run test:skill
              npm run test:infight
          # the QuakeC VM: the real progs.dat, compiled to PSQL, on the engine's physics, the page's mode
          - group: QuakeC
            run: |
              npm run test:qcjit
              npm run test:qcvm
              npm run test:qcplay
              npm run test:qctic
          # LibreQuake: its smoke test, levels, boss trap and progs.dat; deathmatch bots; BSP2 maps; mods
          - group: LibreQuake, mods and deathmatch
            run: |
              PAK=public/pak/lq1/pak0.pak PAK1=public/pak/lq1/pak1.pak node scripts/sql-smoke.mjs start
              npm run test:lq
              npm run test:qclq
              npm run test:dm
              npm run test:bsp2
              npm run test:mod
          # the smoke test on E1M1; saves; slime and lava; the registered monsters; the shambler and the
          # fireballs; see-through water; Chthon; Ziggurat Vertigo's low gravity
          - group: game rules
            run: |
              npm test
              npm run test:save
              npm run test:hazard
              npm run test:registered
              npm run test:fire
              npm run test:water
              npm run test:console
              npm run test:boss
              npm run test:e1m8
          # episode 1's set pieces: the drawbridge, the zombie pits, the underwater secret, the flooded moat,
          # the gold key; progs.dat's monsters on the engine
          - group: episode 1
            run: |
              npm run test:e1m2
              npm run test:e1m3
              npm run test:e1m4
              npm run test:e1m5
              npm run test:e1m6
              npm run test:qcai
    name: test (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The paks, from the cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/pak/
            mods/
          key: paks-${{ hashFiles('scripts/fetch-pak.mjs') }}
          fail-on-cache-miss: true
      - name: ${{ matrix.group }}
        run: ${{ matrix.run }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The paks, from the cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/pak/
            mods/
          key: paks-${{ hashFiles('scripts/fetch-pak.mjs') }}
          fail-on-cache-miss: true
      - name: Headless screenshots
        run: npm run screenshots
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
